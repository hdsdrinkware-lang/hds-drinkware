name: Validate static SEO site

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check browser JavaScript syntax
        run: node --check script.js

      - name: Validate SEO, links, schemas, assets and regression baseline
        run: node tools/validate-site.mjs

      - name: Validate Phase 4C structured-data architecture
        run: node tools/validate-schema.mjs

      - name: Confirm generated outputs match their source
        run: node tools/generate-seo-site.mjs --check
